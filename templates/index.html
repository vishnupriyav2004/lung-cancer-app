<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lung Cancer Classifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <div class="min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-2xl rounded-xl p-10 w-full max-w-2xl">
      
      <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">Lung Cancer Prediction</h1>

      <form action="/predict" method="post" enctype="multipart/form-data" class="flex flex-col items-center space-y-4">
        <label class="w-full text-left text-gray-700 font-semibold">Upload LUNG CT-SCAN:</label>
        <input type="file" name="image" accept="image/*" onchange="previewImage(event)" required class="border border-gray-300 rounded px-4 py-2 w-full">
        
        <img id="imagePreview" src="#" alt="Image Preview" class="hidden rounded shadow-md mt-4 w-64 h-auto">

        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded shadow mt-4">
          Predict
        </button>
      </form>

      {% if prediction %}
        <div class="mt-8 text-center">
          <h2 class="text-xl font-bold text-green-600 mb-2">{{ prediction }}</h2>
          <img src="{{ image_path }}" alt="Uploaded Image" class="rounded shadow-md w-64 h-auto mx-auto">
        </div>
      {% endif %}
    </div>
  </div>

  <script>
    function previewImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('imagePreview');
        output.src = reader.result;
        output.classList.remove("hidden");
      };
      reader.readAsDataURL(event.target.files[0]);
    }
  </script>

</body>
</html>
